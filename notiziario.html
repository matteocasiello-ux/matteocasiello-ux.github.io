<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Presente — Notizie aggiornate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F4F1;
    --ink: #161B20;
    --muted: #5B6670;
    --rule: #161B20;
    --soft-rule: #CDD2D6;
    --alert: #D9412A;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101417;
      --ink: #E9ECEE;
      --muted: #9AA5AE;
      --rule: #E9ECEE;
      --soft-rule: #2A3238;
      --alert: #FF6B52;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101417;
    --ink: #E9ECEE;
    --muted: #9AA5AE;
    --rule: #E9ECEE;
    --soft-rule: #2A3238;
    --alert: #FF6B52;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* Testata */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted);
    padding: 12px 0; border-bottom: 1px solid var(--soft-rule);
  }
  .masthead {
    text-align: center; padding: 28px 0 18px;
    border-bottom: 3px double var(--rule);
  }
  .masthead h1 {
    font-family: var(--serif); font-weight: 800;
    font-size: clamp(44px, 9vw, 92px); line-height: 1; margin: 0;
    letter-spacing: -0.02em;
  }
  .masthead p { margin: 10px 0 0; color: var(--muted); font-size: 15px; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--rule);
  }
  nav.cats { display: flex; flex-wrap: wrap; gap: 4px; }
  nav.cats button {
    background: none; border: 0; padding: 8px 12px; cursor: pointer;
    border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500;
  }
  nav.cats button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--alert); }
  nav.cats button:focus-visible, .controls input:focus-visible, .toggle:focus-visible, .card:focus-visible {
    outline: 2px solid var(--alert); outline-offset: 2px;
  }
  .search {
    border: 1px solid var(--soft-rule); background: transparent;
    padding: 8px 12px; min-width: 200px; border-radius: 2px;
  }
  .toggle {
    background: none; border: 1px solid var(--soft-rule); padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--muted);
  }

  /* Prima pagina */
  .front {
    display: grid; grid-template-columns: 1.6fr 1fr; gap: 32px;
    padding: 28px 0; border-bottom: 1px solid var(--rule);
  }
  .lead h2 {
    font-family: var(--serif); font-weight: 800;
    font-size: clamp(30px, 4.6vw, 52px); line-height: 1.05; margin: 8px 0 14px;
    letter-spacing: -0.015em; cursor: pointer;
  }
  .lead p { font-size: 18px; color: var(--ink); max-width: 60ch; margin: 0 0 12px; }
  .meta { font-size: 13px; color: var(--muted); }
  .tag { color: var(--alert); font-weight: 600; font-size: 13px; }
  .briefs h3 {
    font-family: var(--sans); font-size: 13px; font-weight: 600; margin: 0 0 8px;
    padding-bottom: 8px; border-bottom: 1px solid var(--rule);
  }
  .briefs ol { list-style: none; padding: 0; margin: 0; }
  .briefs li { padding: 14px 0; border-bottom: 1px solid var(--soft-rule); }
  .briefs button {
    all: unset; cursor: pointer; font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.25; display: block;
  }
  .briefs button:hover, .lead h2:hover { text-decoration: underline; text-underline-offset: 4px; }
  .briefs button:focus-visible { outline: 2px solid var(--alert); outline-offset: 2px; }

  /* Griglia */
  .section-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--rule);
  }
  .section-title h2 { font-family: var(--serif); font-size: 26px; margin: 0; font-weight: 600; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px;
    padding-bottom: 40px;
  }
  .card {
    cursor: pointer; border-top: 3px solid var(--soft-rule); padding-top: 14px;
  }
  .card:hover h3 { text-decoration: underline; text-underline-offset: 4px; }
  .card h3 { font-family: var(--serif); font-size: 22px; line-height: 1.2; margin: 6px 0 8px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }
  .empty { color: var(--muted); padding: 40px 0; }

  /* Dettaglio */
  dialog {
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule);
    max-width: 680px; width: calc(100% - 32px); padding: 28px; border-radius: 0;
  }
  dialog::backdrop { background: rgba(10, 14, 18, 0.6); }
  dialog h2 { font-family: var(--serif); font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 8px 0 14px; }
  dialog .body { font-family: var(--serif); font-size: 19px; line-height: 1.6; }
  dialog .body p { margin: 0 0 1em; }
  dialog .close {
    float: right; background: none; border: 1px solid var(--rule); padding: 6px 12px; cursor: pointer;
  }
  dialog .close:focus-visible { outline: 2px solid var(--alert); }

  footer {
    border-top: 3px double var(--rule); padding: 20px 0 32px;
    font-size: 13px; color: var(--muted); text-align: center;
  }

  /* Mobile */
  @media (max-width: 800px) {
    .front { grid-template-columns: 1fr; gap: 20px; }
    .search { min-width: 0; flex: 1; }
    .topbar { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span id="data-oggi"></span>
    <button class="toggle" id="tema" type="button">Tema scuro</button>
  </div>

  <header class="masthead">
    <h1>Il Presente</h1>
    <p>Notizie aggiornate, ogni giorno</p>
  </header>

  <div class="controls">
    <nav class="cats" aria-label="Categorie" id="categorie"></nav>
    <input class="search" id="cerca" type="search" placeholder="Cerca una notizia" aria-label="Cerca una notizia">
  </div>

  <section class="front" id="prima-pagina" aria-label="Prima pagina"></section>

  <div class="section-title">
    <h2 id="titolo-sezione">Tutte le notizie</h2>
    <span class="meta" id="conteggio"></span>
  </div>
  <section class="grid" id="griglia" aria-live="polite"></section>

</div>

<dialog id="dettaglio" aria-labelledby="dett-titolo">
  <button class="close" type="button" id="chiudi">Chiudi</button>
  <div class="meta" id="dett-meta"></div>
  <h2 id="dett-titolo"></h2>
  <div class="body" id="dett-corpo"></div>
</dialog>

<footer>
  <div class="wrap">Il Presente · Contenuti di esempio: sostituisci l'array <code>NOTIZIE</code> nello script.</div>
</footer>

<script>
  // Modifica qui: ogni notizia ha categoria, data (AAAA-MM-GG), titolo, riassunto e testo.
  const NOTIZIE = [
    {
      id: 1, cat: "Politica", data: "2026-11-24", evidenza: true,
      titolo: "Il Parlamento discute la nuova legge sulla casa",
      riassunto: "Il provvedimento punta ad aumentare l'offerta di alloggi a canone accessibile nelle città medie.",
      testo: ["Il testo, presentato in commissione, prevede incentivi per i comuni che recuperano edifici inutilizzati.", "Le opposizioni chiedono più risorse e tempi di attuazione certi. Il voto in aula è previsto per la prossima settimana."]
    },
    {
      id: 2, cat: "Economia", data: "2026-11-24",
      titolo: "Inflazione in calo per il terzo mese consecutivo",
      riassunto: "I prezzi dei beni energetici tornano a scendere, mentre i servizi restano stabili.",
      testo: ["Secondo i dati provvisori, il rallentamento riguarda soprattutto l'energia e i trasporti.", "Gli analisti invitano alla prudenza: la componente dei servizi resta il punto critico per le prossime rilevazioni."]
    },
    {
      id: 3, cat: "Tecnologia", data: "2026-11-23",
      titolo: "Un nuovo sistema per la ricarica rapida delle auto elettriche",
      riassunto: "Il prototipo promette tempi di ricarica dimezzati senza usare nuove infrastrutture.",
      testo: ["I ricercatori hanno presentato il sistema in un laboratorio universitario.", "Per la diffusione commerciale servono ancora test su larga scala e la certificazione dei produttori."]
    },
    {
      id: 4, cat: "Sport", data: "2026-11-23",
      titolo: "Derby decisivo per la corsa al titolo",
      riassunto: "Domenica si gioca la partita che può cambiare la classifica in vetta.",
      testo: ["Le due squadre arrivano al match con gli stessi punti e diverse assenze in difesa.", "Il calcio d'inizio è previsto alle 18:00, in diretta televisiva."]
    },
    {
      id: 5, cat: "Cultura", data: "2026-11-22",
      titolo: "Riapre il museo della città dopo due anni di restauri",
      riassunto: "Nuove sale espositive e un percorso dedicato ai bambini.",
      testo: ["L'edificio ottocentesco è stato messo in sicurezza e riportato all'aspetto originale.", "L'ingresso resterà gratuito per tutto il primo mese di apertura."]
    },
    {
      id: 6, cat: "Ambiente", data: "2026-11-22",
      titolo: "Piogge intense: allerta in tre regioni del nord",
      riassunto: "La protezione civile invita a evitare gli spostamenti non necessari nelle aree a rischio.",
      testo: ["Le precipitazioni potrebbero continuare fino a domani sera.", "Consigliato seguire gli aggiornamenti ufficiali e non attraversare zone allagate."]
    },
    {
      id: 7, cat: "Salute", data: "2026-11-21",
      titolo: "Campagna di prevenzione stagionale al via nelle scuole",
      riassunto: "Visite gratuite e informazioni per famiglie e insegnanti.",
      testo: ["L'iniziativa coinvolge oltre cento istituti in tutto il paese.", "Le adesioni si raccolgono attraverso il sito della propria azienda sanitaria."]
    },
    {
      id: 8, cat: "Economia", data: "2026-11-21",
      titolo: "Le piccole imprese chiedono semplificazioni fiscali",
      riassunto: "Le associazioni di categoria presentano un documento con dieci proposte.",
      testo: ["Tra le richieste: meno adempimenti burocratici e scadenze fiscali unificate.", "Il governo ha annunciato un tavolo di confronto nelle prossime settimane."]
    }
  ];

  const CATEGORIE = ["Tutte", ...new Set(NOTIZIE.map(n => n.cat))];
  let categoriaAttiva = "Tutte";

  const $ = id => document.getElementById(id);

  function formatData(iso) {
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
  }

  function creaCard(n) {
    const el = document.createElement("article");
    el.className = "card";
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.innerHTML = "";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = n.cat + " · " + (n.fonte ? n.fonte + " · " : "") + formatData(n.data);
    const h = document.createElement("h3");
    h.textContent = n.titolo;
    const p = document.createElement("p");
    p.textContent = n.riassunto;
    el.append(meta, h, p);
    el.addEventListener("click", () => apriDettaglio(n));
    el.addEventListener("keydown", e => { if (e.key === "Enter") apriDettaglio(n); });
    return el;
  }

  function filtra() {
    const q = $("cerca").value.trim().toLowerCase();
    return NOTIZIE
      .filter(n => categoriaAttiva === "Tutte" || n.cat === categoriaAttiva)
      .filter(n => !q || (n.titolo + " " + n.riassunto + " " + n.cat).toLowerCase().includes(q))
      .sort((a, b) => b.data.localeCompare(a.data));
  }

  function render() {
    const lista = filtra();

    // Prima pagina: solo quando non ci sono filtri attivi
    const front = $("prima-pagina");
    front.innerHTML = "";
    const filtrato = categoriaAttiva !== "Tutte" || $("cerca").value.trim() !== "";
    if (!filtrato && lista.length) {
      const lead = document.createElement("div");
      lead.className = "lead";
      const principale = lista.find(n => n.evidenza) || lista[0];
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = principale.cat;
      const h2 = document.createElement("h2");
      h2.textContent = principale.titolo;
      h2.tabIndex = 0;
      h2.addEventListener("click", () => apriDettaglio(principale));
      h2.addEventListener("keydown", e => { if (e.key === "Enter") apriDettaglio(principale); });
      const p = document.createElement("p");
      p.textContent = principale.riassunto;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = formatData(principale.data);
      lead.append(tag, h2, p, meta);

      const briefs = document.createElement("aside");
      briefs.className = "briefs";
      const titolo = document.createElement("h3");
      titolo.textContent = "Ultime notizie";
      const ol = document.createElement("ol");
      lista.filter(n => n !== principale).slice(0, 4).forEach(n => {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = n.titolo;
        b.addEventListener("click", () => apriDettaglio(n));
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = n.cat + " · " + formatData(n.data);
        li.append(b, m);
        ol.append(li);
      });
      briefs.append(titolo, ol);
      front.append(lead, briefs);
    }

    // Griglia
    const griglia = $("griglia");
    griglia.innerHTML = "";
    const elenco = filtrato ? lista : lista.filter(n => !(front.querySelector("h2") && n.titolo === front.querySelector("h2").textContent));
    if (!elenco.length) {
      const v = document.createElement("p");
      v.className = "empty";
      v.textContent = "Nessuna notizia trovata. Prova con un'altra ricerca o categoria.";
      griglia.append(v);
    } else {
      elenco.forEach(n => griglia.append(creaCard(n)));
    }
    $("titolo-sezione").textContent = categoriaAttiva === "Tutte" ? "Tutte le notizie" : categoriaAttiva;
    $("conteggio").textContent = elenco.length + (elenco.length === 1 ? " notizia" : " notizie");
  }

  function costruisciCategorie() {
    const nav = $("categorie");
    CATEGORIE.forEach(c => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c;
      b.setAttribute("aria-pressed", c === categoriaAttiva ? "true" : "false");
      b.addEventListener("click", () => {
        categoriaAttiva = c;
        nav.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
        render();
      });
      nav.append(b);
    });
  }

  function apriDettaglio(n) {
    $("dett-meta").textContent = n.cat + " · " + formatData(n.data);
    $("dett-titolo").textContent = n.titolo;
    const corpo = $("dett-corpo");
    corpo.innerHTML = "";
    const paragrafi = n.testo && n.testo.length ? n.testo : [n.riassunto];
    paragrafi.forEach(par => {
      const p = document.createElement("p");
      p.textContent = par;
      corpo.append(p);
    });
    if (n.url) {
      const a = document.createElement("a");
      a.href = n.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Leggi l'articolo completo su " + (n.fonte || "la fonte originale");
      a.style.fontFamily = "var(--sans)";
      a.style.fontSize = "15px";
      a.style.color = "var(--alert)";
      corpo.append(a);
    }
    $("dettaglio").showModal();
  }

  $("chiudi").addEventListener("click", () => $("dettaglio").close());
  $("dettaglio").addEventListener("click", e => { if (e.target === $("dettaglio")) $("dettaglio").close(); });
  $("cerca").addEventListener("input", render);

  $("tema").addEventListener("click", () => {
    const root = document.documentElement;
    const scuro = root.getAttribute("data-theme") === "dark" ||
      (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", scuro ? "light" : "dark");
    $("tema").textContent = scuro ? "Tema scuro" : "Tema chiaro";
  });

  $("data-oggi").textContent = new Date().toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  costruisciCategorie();
  render();
</script>
</body>
</html>
